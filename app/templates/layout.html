<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TRIVO-AI - Formulación Inteligente de Masas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <i class="bi bi-hexagon-fill me-2 text-success"></i>
                <span>TRIVO-<span class="highlight">AI</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'optimize' %}active{% endif %}" href="{{ url_for('optimize') }}">Crear Receta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'validate' %}active{% endif %}" href="{{ url_for('validate') }}">Validar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}">Acerca de</a>
                    </li>
                    <li class="nav-item ms-2">
                        <button id="mode-toggle" class="btn btn-sm mode-toggle" aria-label="Toggle dark mode">
                            <i class="bi bi-moon-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-3">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="mb-0">© 2023-2024 TRIVO-AI - Todos los derechos reservados</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="https://github.com/trivoai" target="_blank" rel="noopener" class="text-decoration-none">
                        <i class="bi bi-github me-1"></i>GitHub
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Dark mode toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const body = document.body;
            const modeToggle = document.getElementById('mode-toggle');
            const modeIcon = modeToggle.querySelector('i');
            
            // Check for saved mode preference or respect OS preference
            const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedMode = localStorage.getItem('darkMode');
            
            // Apply initial mode
            if (savedMode === 'dark' || (savedMode === null && prefersDarkMode)) {
                body.classList.add('dark-mode');
                modeIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
            }
            
            // Toggle between light and dark mode
            modeToggle.addEventListener('click', function() {
                body.classList.toggle('dark-mode');
                
                // Update icon
                if (body.classList.contains('dark-mode')) {
                    modeIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
                    localStorage.setItem('darkMode', 'dark');
                } else {
                    modeIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
                    localStorage.setItem('darkMode', 'light');
                }
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
