<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Prueba - TRIVO-AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="mb-4">Formulario de Prueba</h1>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <form action="/natural-language" method="post">
                            <div class="mb-3">
                                <label for="user_text" class="form-label">Describe tu receta ideal:</label>
                                <textarea class="form-control" id="user_text" name="user_text" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Generar Receta</button>
                        </form>
                    </div>
                </div>
                
                <a href="/" class="btn btn-secondary">Volver al inicio</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
